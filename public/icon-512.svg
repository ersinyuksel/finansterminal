<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />
  <!-- Pulse Chart Line -->
  <path d="M 64 300 L 140 300 L 190 200 L 250 360 L 310 160 L 370 280 L 448 180" fill="none" stroke="url(#lineGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Circles on Key Peaks -->
  <circle cx="310" cy="160" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
  <circle cx="448" cy="180" r="14" fill="#34d399" stroke="#ffffff" stroke-width="6" />
</svg>
